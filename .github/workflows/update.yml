# Free, serverless operation:
# every 2 hours GitHub collects the news, saves it to site-data/, rebuilds the web app
# and publishes it to GitHub Pages. No computer of yours needs to be on.
name: Collect news and publish

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # commit updated site-data/
  pages: write
  id-token: write

concurrency:
  group: collect-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Collect news
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # optional; empty = extractive key facts
        run: |
          pip install -r requirements.txt
          python -m app.export --previous ../site-data/articles.json --out ../site-data

      - name: Save collected data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data
          git diff --cached --quiet || (git commit -m "Update news data" && git push)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Build web app
        working-directory: mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_DATA_URL: /${{ github.event.repository.name }}/data
        run: |
          npm ci
          npx expo export --platform web --output-dir dist
          cp -r ../site-data dist/data
          node scripts/pwa.mjs dist "$EXPO_BASE_URL"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
